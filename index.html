<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>بیست بوی — مدل سه‌بعدی کامل | Beast Boy 3D</title>
<style>
  :root{
    --bg:#101216; --panel:#171a20cc; --line:#2a2f3a; --txt:#e8eaf0; --sub:#9aa3b2;
    --accent:#79c257; --accent2:#8e2b47;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
    font-family:"Vazirmatn","Segoe UI",Tahoma,Arial,sans-serif;}
  #app{position:fixed; inset:0;}
  canvas{display:block;}

  .panel{
    position:fixed; z-index:10; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; backdrop-filter:blur(10px);
    box-shadow:0 8px 30px #0008;
  }
  #hud-top{ top:14px; right:14px; max-width:340px;}
  #hud-top h1{font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px;}
  #hud-top h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 12px var(--accent);}
  #hud-top p{font-size:11.5px; color:var(--sub); margin-top:6px; line-height:1.7;}
  #polycount{font-size:11px; color:var(--sub); margin-top:8px; direction:ltr; text-align:right;}

  .group-label{font-size:10.5px; color:var(--sub); margin:10px 0 5px; letter-spacing:.5px;}
  .btn-row{display:flex; flex-wrap:wrap; gap:6px;}
  button{
    font-family:inherit; font-size:12px; color:var(--txt); background:#232833;
    border:1px solid var(--line); border-radius:9px; padding:6px 11px; cursor:pointer;
    transition:all .15s ease;
  }
  button:hover{background:#2d3442; border-color:#3b4352;}
  button.active{background:var(--accent); color:#0c1408; border-color:var(--accent); font-weight:700;}
  button.wide{width:100%; margin-top:6px;}
  button.accent{background:linear-gradient(135deg,#79c257,#4d9a34); color:#0c1408;
    font-weight:700; border:none;}
  button.accent:hover{filter:brightness(1.08);}

  #hud-left{ top:14px; left:14px; width:200px;}
  #hint{
    position:fixed; bottom:14px; right:50%; transform:translateX(50%); z-index:10;
    font-size:11.5px; color:var(--sub); background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:7px 18px; backdrop-filter:blur(8px); white-space:nowrap;
  }
  #loader{
    position:fixed; inset:0; z-index:100; background:var(--bg); display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:18px;
    transition:opacity .6s ease;
  }
  #loader.done{opacity:0; pointer-events:none;}
  #loader .spin{width:54px; height:54px; border-radius:50%;
    border:3px solid #2a2f3a; border-top-color:var(--accent); animation:sp 1s linear infinite;}
  #loader p{font-size:13px; color:var(--sub);}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:760px){
    #hud-top{max-width:250px; padding:10px;}
    #hud-top p{display:none;}
    #hud-left{width:160px;}
    #hint{display:none;}
  }
</style>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" onerror="this.remove()">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div id="loader">
  <div class="spin"></div>
  <p>در حال ساخت مدل سه‌بعدی بیست بوی…</p>
</div>

<div id="hud-top" class="panel">
  <h1><span class="dot"></span> بیست بوی <span style="font-weight:400; color:var(--sub); font-size:12px;">Beast Boy — Titans</span></h1>
  <p>مدل سه‌بعدی کامل و پرجزئیات — پوست سبز، موهای سبز تیره، کاپشن بمبر سفید و زرشکی، شلوار جین و کفش. با ماوس بچرخان و زوم کن.</p>

  <div class="group-label">نمای دوربین</div>
  <div class="btn-row" id="view-btns">
    <button data-view="front">روبه‌رو</button>
    <button data-view="back">پشت</button>
    <button data-view="right">سمت راست</button>
    <button data-view="left">سمت چپ</button>
    <button data-view="face">چهره</button>
    <button data-view="full">تمام‌قد</button>
  </div>

  <div class="group-label">تنظیمات نمایش</div>
  <div class="btn-row">
    <button id="btn-rotate" class="active">چرخش خودکار</button>
    <button id="btn-wire">وایرفریم</button>
    <button id="btn-stage">صحنه</button>
  </div>
  <div class="btn-row" style="margin-top:6px;">
    <button id="light-studio" class="active">نور استودیو</button>
    <button id="light-warm">نور گرم</button>
    <button id="light-dram">دراماتیک</button>
  </div>

  <button id="btn-glb" class="wide accent">⬇ دانلود مدل (GLB)</button>
  <div id="polycount">—</div>
</div>

<div id="hint">🖱 درگ: چرخش &nbsp;•&nbsp; اسکرول: زوم &nbsp;•&nbsp; راست‌درگ: جابه‌جایی</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
